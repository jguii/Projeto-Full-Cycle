openapi: 3.1.0
info:
  title: API de Pedidos
  version: 1.0.0
  description: |
    Projeto B (simples) do projeto final Full Cycle. Fluxo principal:
    criar pedido → consultar → avançar status (PENDING → PAID → SHIPPED → DELIVERED, ou CANCELED).
    Valores monetários são inteiros em centavos.
  contact:
    name: João Guilherme Pimentel
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: http://localhost:3000
    description: Ambiente local (docker compose)
tags:
  - name: Pedidos
    description: Fluxo principal do domínio
  - name: Operação
    description: Saúde e métricas
paths:
  /orders:
    post:
      tags: [Pedidos]
      operationId: createOrder
      summary: Cria um pedido (endpoint principal)
      description: Cria um pedido com status PENDING. O total é calculado no servidor a partir dos itens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerName: Maria Silva
              items:
                - sku: CAFE-500G
                  name: Café torrado 500g
                  quantity: 2
                  unitPriceCents: 2990
      responses:
        '201':
          description: Pedido criado com status PENDING
          headers:
            Location:
              description: URL do pedido criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Pedidos]
      operationId: listOrders
      summary: Lista pedidos (mais recentes primeiro)
      description: Lista paginada, com filtro opcional por status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{id}:
    get:
      tags: [Pedidos]
      operationId: getOrder
      summary: Consulta um pedido
      description: Retorna o pedido com itens e total.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/status:
    patch:
      tags: [Pedidos]
      operationId: changeOrderStatus
      summary: Avança o status do pedido
      description: |
        Transições válidas: PENDING→PAID, PENDING→CANCELED, PAID→SHIPPED, PAID→CANCELED, SHIPPED→DELIVERED.
        Qualquer outra retorna 409.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
            example:
              status: PAID
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transição de status não permitida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health/live:
    get:
      tags: [Operação]
      operationId: liveness
      summary: Liveness (processo de pé)
      description: Usado pelo HEALTHCHECK do contêiner. Não consulta dependências.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [Operação]
      operationId: readiness
      summary: Readiness (banco acessível)
      description: Executa SELECT 1 no Postgres e retorna 503 se o banco estiver indisponível.
      responses:
        '200':
          description: Pronto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /metrics:
    get:
      tags: [Operação]
      operationId: metrics
      summary: Métricas no formato Prometheus
      description: Inclui http_request_duration_seconds (base do SLO) e orders_created_total.
      responses:
        '200':
          description: Métricas em texto
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELED]
    OrderItem:
      type: object
      required: [sku, name, quantity, unitPriceCents]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        unitPriceCents:
          type: integer
          minimum: 0
          description: Preço unitário em centavos
    CreateOrderRequest:
      type: object
      required: [customerName, items]
      properties:
        customerName:
          type: string
          minLength: 1
          maxLength: 120
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItem'
    Order:
      type: object
      required: [id, customerName, items, status, totalCents, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalCents:
          type: integer
          description: Soma de quantity × unitPriceCents
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Pedido não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Regra de negócio violada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
