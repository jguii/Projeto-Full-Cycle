name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck e testes unitários (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lint:openapi
      - name: Testes unitários com coverage mínimo (vitest.config.ts)
        run: npm run test:unit
      - name: Resumo de coverage
        if: always()
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          node -e "const t=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('- '+k+': '+t[k].pct+'%')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
      - name: Auditoria de dependências (SCA)
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Teste de integração (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pedidos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d pedidos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Credencial descartável de um banco efêmero da CI — não é segredo real.
      DATABASE_URL: postgres://ci:ci@localhost:5432/pedidos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1

  smoke:
    name: Docker build + smoke k6 (p95)
    runs-on: ubuntu-latest
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a stack com 1 comando
        run: docker compose up -d --build --wait api
      - name: k6 smoke
        run: docker compose --profile k6 run --rm k6
      - name: p95 no resumo do job
        if: always()
        run: |
          echo '### k6 smoke' >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./k6/results/summary.json').metrics;for(const k of Object.keys(m).filter(k=>k.startsWith('http_req_duration')))console.log('- '+k+' p95: '+m[k]['p(95)'].toFixed(2)+' ms')" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs da API em caso de falha
        if: failure()
        run: docker compose logs api
      - name: Derruba a stack
        if: always()
        run: docker compose down -v
